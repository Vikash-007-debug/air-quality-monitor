<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROMONITOR - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">

    <!-- Animated PCB Circuit Wire Canvas -->
    <canvas id="pcbCircuitCanvas" class="pcb-circuit-canvas"></canvas>

    <!-- Login Container -->
    <div class="login-container" style="position: relative; z-index: 1;">
        <div class="login-card" style="backdrop-filter: blur(16px); background: linear-gradient(145deg, rgba(20, 20, 30, 0.9) 0%, rgba(12, 12, 18, 0.95) 100%);">
            
            <!-- Return to Home Shortcut -->
            <div style="text-align: left; margin-bottom: 20px;">
                <a href="index.html" class="home-nav-link" style="font-size: 12px; color: var(--text-dim); text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> <span>Back to Home</span>
                </a>
            </div>

            <div class="login-header">
                <div class="logo-icon" style="background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%); color: #08080c; box-shadow: 0 8px 30px rgba(255, 255, 255, 0.25);">
                    <i class="fas fa-wind"></i>
                </div>
                <h1>AERO<span style="color: var(--accent-cyan);">MONITOR</span></h1>
                <p>ESP32 Matte Hardware Environmental Telemetry</p>
            </div>

            <div class="login-body">
                <div class="features">
                    <div class="feature-item">
                        <i class="fas fa-temperature-half"></i>
                        <span>DHT11 Climate</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-smog"></i>
                        <span>MQ-135 Gas</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-bell"></i>
                        <span>Gmail Alerts</span>
                    </div>
                </div>

                <button class="google-btn" id="googleSignInBtn" onclick="signInWithGoogle()" style="font-family: inherit; font-weight: 700;">
                    <svg width="20" height="20" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <p class="login-footer-text">Auto-binds your Gmail for 24/7 emergency telemetry alerts</p>
            </div>
        </div>

        <p class="copyright">&copy; 2026 AEROMONITOR &bull; ESP32 IoT Project &bull; Matte PCB Edition</p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pcb-canvas.js"></script>
</body>
</html>
